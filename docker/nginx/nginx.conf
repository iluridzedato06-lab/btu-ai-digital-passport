# Production reverse proxy (docker compose --profile prod up -d).
# Put TLS certificates in docker/nginx/certs/fullchain.pem and privkey.pem,
# set PUBLIC_BASE_URL=https://your-domain, BEHIND_TLS_PROXY=true, SECURE_COOKIES=true in .env.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  server_tokens off;
  client_max_body_size 2m;

  # Rate limits: public verification and sign-in endpoints
  limit_req_zone $binary_remote_addr zone=public:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  upstream web      { server web:8000; }
  upstream frontend { server frontend:3000; }

  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/public/      { limit_req zone=public burst=20 nodelay; proxy_pass http://web; }
    location /api/auth/        { limit_req zone=auth burst=5 nodelay;    proxy_pass http://web; }
    location /api/             { proxy_pass http://web; }
    location /django-admin/    { proxy_pass http://web; }
    location /django-static/   { proxy_pass http://web; }
    location = /.well-known/btu-issuer.json {
      proxy_pass http://web/api/public/issuer;
      add_header Access-Control-Allow-Origin "*" always;
    }
    location / { proxy_pass http://frontend; }
  }
}
